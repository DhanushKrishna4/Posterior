name: Verify and build Posterior
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified artifact to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: posterior-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PYTHON: python
      - run: npm run test:redesign
        env:
          POSTERIOR_REPORT_DIR: reports/redesign/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            reports/browser/
            reports/redesign/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Publishing is an explicit manual action. Pushes and PRs verify only.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static files
        id: deployment
        uses: actions/deploy-pages@v4
