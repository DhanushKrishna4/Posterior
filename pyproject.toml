[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterior-lab"
version = "0.1.0"
description = "Inspectable CPU Bayesian inference with a static browser workbench"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "arviz==0.21.0", "matplotlib==3.10.8", "emcee==3.1.6", "build==1.3.0"]

[project.scripts]
posterior = "posterior_lab.cli:main"

[tool.setuptools.packages.find]
include = ["posterior_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

